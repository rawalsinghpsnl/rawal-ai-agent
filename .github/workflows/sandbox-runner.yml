# rawal-ai-agent — GitHub Actions sandbox runner (cloud exec backend).
# SPDX-License-Identifier: MIT
# Dispatched by backend/app/sandbox/github_actions.py with inputs {run_id, command}.
# Keep run-name + artifact names in sync with WORKFLOW_YAML in that file.
name: rawal-ai-agent Sandbox Runner

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique id for this exec (used for run name + artifact)'
        required: true
        type: string
      command:
        description: 'Command to execute in the runner workspace'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: sandbox-${{ inputs.run_id }}
  cancel-in-progress: false

run-name: "rawal-${{ inputs.run_id }}"

jobs:
  run-sandbox:
    name: Execute agent command
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute and capture
        env:
          RAWAL_COMMAND: ${{ inputs.command }}
          RAWAL_RUN_ID: ${{ inputs.run_id }}
        run: |
          set +e
          bash -c "$RAWAL_COMMAND" > /tmp/rawal-stdout.txt 2> /tmp/rawal-stderr.txt
          code=$?
          python3 - "$code" <<'EOF'
          import json, sys
          code = int(sys.argv[1])
          with open('/tmp/rawal-stdout.txt', encoding='utf-8', errors='replace') as f:
              stdout = f.read()[-400000:]
          with open('/tmp/rawal-stderr.txt', encoding='utf-8', errors='replace') as f:
              stderr = f.read()[-100000:]
          with open('rawal-result.json', 'w', encoding='utf-8') as f:
              json.dump({'stdout': stdout, 'stderr': stderr, 'exit_code': code}, f)
          EOF

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: rawal-result-${{ inputs.run_id }}
          path: rawal-result.json
          retention-days: 1
